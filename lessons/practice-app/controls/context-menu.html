<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Menu - Controls Practice</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .context-target {
      border: 2px dashed #90caf9; border-radius: 12px; padding: 3em; text-align: center;
      color: #1976d2; background: #f5faff; user-select: none;
    }
    .context-menu {
      display: none; position: fixed; z-index: 20; background: #fff; border: 1px solid #bdbdbd;
      border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.2); min-width: 160px; padding: 0.3em 0;
    }
    .context-menu.show { display: block; }
    .context-menu-item { padding: 0.6em 1em; cursor: pointer; }
    .context-menu-item:hover { background: #e3f2fd; }
    .context-menu-separator { height: 1px; background: #eee; margin: 0.3em 0; }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html">Basic Controls</a> |
    <a href="../controls-hub.html"><b>Controls Hub</b></a> |
    <a href="../dialogs.html">Dialogs &amp; Windows</a> |
    <a href="../hrms/login.html" style="color:#ffeb3b;font-weight:bold">🏢 HRMS App</a>
  </nav>

  <section class="home-hero" style="max-width:760px;margin:0 auto 1rem auto;padding:0 1em;">
    <h1 style="font-size:2rem;margin-bottom:0.4rem;text-align:left;">Context Menu</h1>
    <div style="margin-bottom:1rem;">
      <span class="badge badge-blue">Practice Lab</span>
      <span class="badge badge-orange">UI Automation</span>
    </div>
    <p style="font-size:1.05rem;color:#444;">Right-click the box below to open a custom menu. Playwright: use
      <code>locator.click({ button: 'right' })</code>.</p>
  </section>

  <section class="practice-section">
    <h2>Right-Click Area</h2>
    <div class="context-target" id="context-target" data-testid="context-target">
      Right-click anywhere in this box
    </div>
    <div class="status-label" id="status-context" data-testid="status-context"></div>
  </section>

  <div class="context-menu" id="context-menu" data-testid="context-menu">
    <div class="context-menu-item" data-action="copy" data-testid="ctx-copy">Copy</div>
    <div class="context-menu-item" data-action="paste" data-testid="ctx-paste">Paste</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="rename" data-testid="ctx-rename">Rename</div>
    <div class="context-menu-item" data-action="delete" data-testid="ctx-delete">Delete</div>
  </div>

  <a href="../../../index.html" class="home-btn floating-home-btn" title="Back to Home">&#8962; Home</a>
  <script src="../../../assets/app.js"></script>
  <script src="../practice-common.js"></script>
  <script>
    const target = document.getElementById('context-target');
    const menu = document.getElementById('context-menu');

    target.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      menu.style.left = `${e.clientX}px`;
      menu.style.top = `${e.clientY}px`;
      menu.classList.add('show');
      showStatus('status-context', 'Context menu opened successfully.');
    });

    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target)) menu.classList.remove('show');
    });

    menu.querySelectorAll('.context-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        menu.classList.remove('show');
        showStatus('status-context', `Action performed successfully: ${item.getAttribute('data-action')}`);
      });
    });
  </script>
</body>
</html>
